<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">
        <title>Metric/Imperial Conversion</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div id="hero-container">
                <h1 id="title">Metric/Imperial Conversion</h1>
                <input type="text" id="input-container" placeholder="0">
                <button id="convert-btn">Convert</button>
                <div class="theme-btn">
                    <button id="light-btn" onclick="toggleLight()">light</button>
                    <button id="dark-btn" onclick="toggleDark()">dark</button>
                </div>
            </div>
            
            <div id="card-container">
                <div class="card">
                    <h3 class="card-title">Length (Meters/Feet)</h3>
                    <p class="card-text" id="length-result">0 m = 0.000 ft | 0 ft = 0.000 m</p>
                </div>
                
                <div class="card">
                    <h3 class="card-title">Volume (Liters/Gallons)</h3>
                    <p class="card-text" id="volume-result">0 L = 0.000 gal | 0 gal = 0.000 L</p>
                </div>
                
                <div class="card">
                    <h3 class="card-title">Mass (Kilograms/Pounds)</h3>
                    <p class="card-text" id="mass-result">0 kg = 0.000 lb(s) | 0 lb(s) = 0.000 kg</p>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
